# cargo-deny - dependency vulnerability and licence gate. Runs in CI on every PR.
#
# The crates here are `MIT OR Apache-2.0`, so every dependency must offer a permissive arm. A
# GPL/LGPL-only dependency fails the build rather than being argued about later.

[advisories]
version = 2
# Fail on a yanked crate or any RUSTSEC advisory. An `ignore` entry needs a written justification
# naming why the advisory is unreachable here - never to make a red build green quietly.
yanked = "deny"
# Unmaintained matters when a workspace member depends on one directly; a deep transitive
# proc-macro crate going quiet is noise, not a release gate.
unmaintained = "workspace"
ignore = [
  # crypto-bigint 0.5 (via k256 0.13): constant-time operations may branch on secrets. The fix is
  # 0.7.6 only. Here k256 recovers senders from public signatures on public chain data, and the
  # one signing key lives in the test fixture; no secret reaches these paths.
  "RUSTSEC-2026-0387",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
]
confidence-threshold = 0.9
# Mozilla's root certificate list, which ureq bundles for HTTPS to archive-RPC endpoints. A data
# licence, permissive, and admitted for this crate alone rather than for the tree.
exceptions = [
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
