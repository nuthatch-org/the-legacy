[workspace]
members = ["crates/legacy-format", "crates/legacy-parquet", "crates/legacy-reader", "crates/shadow", "crates/solo"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
# The toolchain this was actually built and tested on, and therefore the only one it can honestly
# claim. Lowering it needs a green `cargo test` + `cargo clippy` on the lower toolchain, not a guess.
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nuthatch-org/the-legacy"
authors = ["Petko Pavlovski"]

[workspace.dependencies]
legacy-format = { path = "crates/legacy-format", version = "0.0.1" }
legacy-parquet = { path = "crates/legacy-parquet", version = "0.0.1" }
legacy-reader = { path = "crates/legacy-reader", version = "0.0.1" }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
arrow-array = "=59.3.0"
arrow-schema = "=59.3.0"
bytes = "1"
parquet = { version = "=59.3.0", default-features = false, features = ["arrow", "zstd"] }
alloy-rlp = "0.3"
sha3 = "0.10"
alloy-trie = { version = "=0.9.5", default-features = false, features = ["std"] }
sha2 = "0.10"
snap = "1"
k256 = { version = "0.13", features = ["ecdsa"] }
toml = "0.8"
roaring = "0.10"
