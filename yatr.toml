# yatr - https://github.com/cargopete/yatr
#
# Task names are the same across every nuthatch-org repo, so `yatr ci` means the same thing
# wherever you are. Note that `ci` is deliberately not called `check`: `yatr check` is a builtin
# that validates this file, and it shadows any task of that name without warning.

[env]
RUST_BACKTRACE = "1"

[settings]
cache = true
watch_debounce_ms = 200

[tasks.fmt]
desc = "Format the tree"
run = ["cargo fmt --all"]
no_cache = true

[tasks.fmt-check]
desc = "Fail if the tree is unformatted"
run = ["cargo fmt --all -- --check"]
sources = ["crates/**/*.rs"]

[tasks.lint]
desc = "Clippy with warnings denied"
run = ["cargo clippy --all-targets -- -D warnings"]
sources = ["crates/**/*.rs", "Cargo.toml", "Cargo.lock"]

[tasks.test]
desc = "Run the test suite"
run = ["cargo test"]
sources = ["crates/**/*.rs", "Cargo.toml", "Cargo.lock"]
watch = ["crates/**/*.rs"]

[tasks.deny]
desc = "cargo-deny: licences, bans, advisories, sources"
run = ["cargo deny check"]
sources = ["deny.toml", "Cargo.lock"]

[tasks.build]
desc = "Build the release binaries"
run = ["cargo build --release"]
sources = ["crates/**/*.rs", "Cargo.toml", "Cargo.lock"]
outputs = ["target/release/solo", "target/release/shadow"]

[tasks.doc]
desc = "Build the API docs"
run = ["cargo doc --no-deps"]
sources = ["crates/**/*.rs"]

[tasks.ci]
desc = "What CI runs: fmt-check, lint, test, deny"
depends = ["fmt-check", "lint", "test", "deny"]
run = []
